services:
  - type: web
    name: gefen-english-coach
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.x
      - key: PB_URL
        sync: false
      - key: AI_PROXY_URL
        value: https://gefen-ai.avivashke95.workers.dev
    healthCheckPath: /api/health
    autoDeploy: true