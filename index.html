    }
    if(!S.words[key]){
      S.words[key]={box:0,due:Date.now()+DAY,seen:1,correct:0,wrong:0,last:Date.now(),key,en,he};
      added++;
    }
    if(!S.words[key].en) S.words[key].en=en;
    if(!S.words[key].he) S.words[key].he=he;
    if(!S.words[key].key) S.words[key].key=key;
  });
  saveNow(); toast(added?`➕ ${added} מילים נכנסו למעגל החזרה`:'המילים כבר במעגל');
  closeModal();
}

/* ================= chat events ================= */
function chatDelegatedClick(e){
  const say=e.target.closest('[data-chat-say]');
  if(say){ const i=+say.dataset.chatSay; const m=S.chat.messages[i]; if(m) speak(m.text); e.stopPropagation(); return; }
  const tr=e.target.closest('[data-chat-tr]');
  if(tr){ const i=+tr.dataset.chatTr; const el=document.querySelector('.msg[data-mi="'+i+'"]'); if(el) el.classList.toggle('show-tr'); e.stopPropagation(); return; }
  const sug=e.target.closest('[data-sug]');
  if(sug){ const msgEl=sug.closest('.msg'); const i=+msgEl.dataset.mi; const m=S.chat.messages[i]; const txt=m&&m.suggestions&&m.suggestions[+sug.dataset.sug]; if(txt) sendText(txt); e.stopPropagation(); return; }
  const quick=e.target.closest('[data-quick]');
  if(quick){ const q=QUICK_PHRASES[+quick.dataset.quick]; closeModal(); const inp=$('#chat-input'); if(q&&inp){ inp.value=q.en; inp.focus(); } e.stopPropagation(); return; }
  const lvl=e.target.closest('[data-set-level]');
  if(lvl){ S.settings.level=lvl.dataset.setLevel; saveNow(); render(); return; }
  const corr=e.target.closest('[data-set-corr]');
  if(corr){ S.settings.correction=corr.dataset.setCorr; saveNow(); render(); return; }
  const tool=e.target.closest('[data-tool]');
  if(tool){ chatTool(tool.dataset.tool); return; }
  if(e.target.closest('[data-chat-learn]')){ addChatWordsToReview(); return; }
}
function chatTool(tool){
  if(tool==='translate'){
    S.settings.showTr=!S.settings.showTr; saveNow();
    document.querySelectorAll('.msg.ai').forEach(m=>m.classList.toggle('show-tr',S.settings.showTr));
    toast(S.settings.showTr?'🌐 תרגום מוצג':'תרגום מוסתר');
  }else if(tool==='autospeak'){
    S.settings.autoSpeak=!S.settings.autoSpeak; saveNow();
    toast(S.settings.autoSpeak?'🔊 המאמנת תקריא תשובות':'הקראה אוטומטית כבויה');
  }else if(tool==='level'){
    const levels=['A1','A2','B1']; const i=levels.indexOf(S.settings.level);
    S.settings.level=levels[(i+1)%levels.length]; saveNow(); toast('רמת שיחה: '+S.settings.level); render();
  }else if(tool==='settings'){ openSettings();
  }else if(tool==='hint'){
    const sc=scenarioById(S.chat.scenario);
    const step=sc&&sc.steps[Math.min(S.chat.localTurn,sc.steps.length-1)];
    const s=step&&step.suggestions&&step.suggestions[0];
    appendAI({reply:s?`Try saying: "${s}"`:'Take your time. Try a short sentence about how you feel.',translation:s?'נסי לומר: '+s:'קחי את הזמן. נסי משפט קצר על איך שאת מרגישה.',corrections:[],suggestions:step?step.suggestions:[],words:[],praise:''});
  }else if(tool==='fix'){ askCorrection();
  }else if(tool==='question'){
    if(canUseAI()){ sendText('Ask me an interesting question about football, animals or science.'); }
    else{
      const sc=scenarioById(S.chat.scenario);
      const q=(sc&&sc.more&&sc.more[Math.floor(Math.random()*sc.more.length)])||'What is your favourite animal, and why?';
      appendAI({reply:q,translation:'שאלה בשבילך – ענה באנגלית.',corrections:[],suggestions:[],words:[],praise:''});
      S.chat.localTurn++;
    }
  }else if(tool==='phrases'){
    openModal(`<button class="x" data-close>✕</button><h3>📖 ביטויים שיעזרו לך</h3><p class="small muted">לחצי על ביטוי כדי להכניס אותו לשיחה, או 🔊 לשמוע.</p>
      <div class="col" style="margin-top:10px">${QUICK_PHRASES.map((q,i)=>`<div class="word"><div class="word-main"><span class="en" style="font-weight:700">${q.en}</span><span class="word-he">${q.he}</span></div>${speakBtn(q.en)}<button class="btn xs ghost" data-quick="${i}">השתמש</button></div>`).join('')}</div>
      <button class="btn primary wide" style="margin-top:10px" data-close>חזרה לשיחה</button>`);
  }
}
function handleChatAction(a,el){
  if(a==='chat-send') sendChat();
  else if(a==='chat-mic') chatMic();
  else if(a==='chat-report') showChatReport();
  else if(a==='chat-new'){
    if((S.chat.messages||[]).length>2 || confirm('להתחיל שיחה חדשה? השיחה הנוכחית תישאר בהיסטוריה.')){
      closeModal();
      S.chat.scenario=''; S.chat.messages=[]; S.chat.localTurn=0; S.chat.learned={}; S.chat.reported=false;
      saveNow(); go('#/chat');
    }
  }
}
let RECOGNIZER=null;
function chatMic(){
  const btn=$('#chat-mic');
  if(RECOGNIZER){ try{ RECOGNIZER.stop(); }catch(e){} RECOGNIZER=null; }
  if(btn) btn.classList.add('rec');
  RECOGNIZER=listenOnce('en-US',alts=>{
    const heard=(alts&&alts[0])||'';
    const inp=$('#chat-input'); if(inp&&heard){ inp.value=heard; inp.focus(); }
    if(btn) btn.classList.remove('rec');
    RECOGNIZER=null;
    if(heard) setTimeout(()=>{ if($('#chat-input')) sendChat(); },250);
  },err=>{
    if(btn) btn.classList.remove('rec');
    RECOGNIZER=null;
    toast(err==='unsupported'?'הדפדפן לא תומך במיקרופון – השתמש במקלדת':'לא שמעתי. בדקי הרשאת מיקרופון');
  },()=>{ if(btn) btn.classList.remove('rec'); RECOGNIZER=null; });
}
boot();
</script>
