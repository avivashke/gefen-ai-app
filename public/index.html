<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#080e18">
  <meta name="description" content="Lamda – אפליקציית אנגלית ושפות אישית עם מאמנת AI, חזרות חכמות ומסלול לימוד מותאם אישית.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Lamda — Language Learning</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="app">
  <aside class="sidebar" id="sidebar" aria-label="תפריט ראשי">
    <div class="sidebar-header">
      <div class="brand-mark">✨</div>
      <div class="brand-txt"><b id="app-name">Lamda</b><span>LANGUAGE COACH</span></div>
    </div>
    <nav class="sidebar-nav">
      <a class="nav-item" data-nav="home" href="#/home"><span class="ic">🏠</span><span>בית</span></a>
      <a class="nav-item" data-nav="learn" href="#/learn"><span class="ic">📚</span><span>מסלול</span></a>
      <a class="nav-item" data-nav="cards" href="#/cards"><span class="ic">🃏</span><span>כרטיסיות</span></a>
      <a class="nav-item" data-nav="review" href="#/review"><span class="ic">🔁</span><span>חזרה</span><span class="badge hide" id="nav-dot-review"></span></a>
      <a class="nav-item" data-nav="chat" href="#/chat"><span class="ic">💬</span><span>מאמנת AI</span></a>
      <a class="nav-item" data-nav="stats" href="#/stats"><span class="ic">📈</span><span>התקדמות</span></a>
      <a class="nav-item" data-nav="admin" href="#/admin"><span class="ic">🛡️</span><span>ניהול מורה</span></a>
    </nav>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="avatar">✨</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-name" id="sidebar-name">תלמיד</div>
          <div class="sidebar-user-stats" id="sidebar-stats"><b id="sidebar-xp">0</b> XP · <b id="sidebar-streak">0</b> ימים</div>
        </div>
      </div>
      <button class="sidebar-btn" data-act="settings" title="הגדרות">⚙️ הגדרות</button>
      <button class="sidebar-btn" data-act="toggle-sound" title="צליל">🔊 צליל</button>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebar-overlay" aria-hidden="true"></div>

  <header class="topbar" id="topbar">
    <div class="topbar-in">
      <div class="topbar-row">
        <button class="menu-toggle" id="menu-toggle" aria-label="פתח תפריט" aria-expanded="false">☰</button>
        <div class="topbar-brand-mini">
          <span class="brand-mark">✨</span>
          <b class="brand-name" id="topbar-brand-name">Lamda</b>
        </div>
        <div class="topbar-nav">
          <button class="topbar-action hide-mobile" data-act="nav-back" aria-label="חזרה למסך הקודם">→ <span>חזרה</span></button>
          <button class="topbar-action primary" id="topbar-login-btn" data-act="student-login-open" aria-label="כניסה לחשבון">🔑 <span>כניסה</span></button>
          <button class="topbar-action danger" data-act="student-logout" aria-label="יציאה מהחשבון">🚪 <span class="hide-mobile">יציאה</span></button>
        </div>
        <div class="hstats">
          <button class="hpill sync-indicator" id="topbar-sync-indicator" title="מצב סנכרון בענן" data-act="settings">☁️</button>
          <div class="hpill streak" title="ימים ברצף">🔥 <b id="h-streak">0</b></div>
          <div class="hpill" title="נקודות ניסיון">⭐ <b id="h-xp">0</b></div>
        </div>
      </div>
      <nav class="top-nav-bar" id="top-nav-bar" aria-label="ניווט ראשי">
        <button class="top-nav-tab" data-nav="home"><span class="ic">🏠</span><span>בית</span></button>
        <button class="top-nav-tab" data-nav="learn"><span class="ic">📚</span><span>מסלול</span></button>
        <button class="top-nav-tab" data-nav="cards"><span class="ic">🃏</span><span>כרטיסיות</span></button>
        <button class="top-nav-tab" data-nav="review"><span class="ic">🔁</span><span>חזרה</span><span class="badge hide" id="nav-dot-review-top"></span></button>
        <button class="top-nav-tab" data-nav="chat"><span class="ic">💬</span><span>שיחה</span></button>
        <button class="top-nav-tab" data-nav="stats"><span class="ic">📈</span><span>התקדמות</span></button>
        <button class="top-nav-tab" data-nav="admin"><span class="ic">🛡️</span><span>מורה</span></button>
      </nav>
    </div>
  </header>

  <main id="main" class="main"></main>
</div>
<div id="overlay" class="overlay" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><div style="padding:30px;text-align:center">האפליקציה צריכה JavaScript. אנא הפעל אותו בדפדפן.</div></noscript>
<script src="/api-sync.js" defer></script>
<script src="/continuation-modules.js" defer></script>
<script src="/app.js" defer></script>
</body>
</html>
