# Netlify deployment config — Gefen English Coach
# See: https://docs.netlify.com/configure-builds/file-based-configuration/

[build]
  publish = "public"
  functions = "netlify/functions"
  command = ""

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Environment variables to set in Netlify (Site settings → Environment variables):
# PB_URL = https://your-pocketbase-instance
# AI_PROXY_URL = https://gefen-ai.avivashke95.workers.dev
# LOCAL_AUTH_SECRET = random secret for local fallback tokens
# NODE_ENV = production